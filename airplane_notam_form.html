<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOTAM Request Form - Airplane Mode</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        @font-face {
            font-family: 'TH Sarabun New';
            src: local('TH Sarabun New'), local('THSarabunNew');
        }

        body {
            background-color: #222;
            font-family: 'TH Sarabun New', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px 0;
        }

        .wrapper {
            width: 2484px;
            height: 3511px;
            position: relative;
            background-color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            transform: scale(0.32);
            transform-origin: top center;
            margin-bottom: -2380px;
        }

        .bg-template {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .input-box {
            position: absolute;
            background: rgba(255, 0, 0, 0.25);
            border: none;
            outline: none;
            font-family: 'TH Sarabun New', sans-serif;
            font-size: 55px;
            color: #000000;
            text-align: center;
            padding: 0;
            margin: 0;
            line-height: 1;
            z-index: 10;
        }

        .input-left {
            text-align: left;
        }

        .check-box {
            position: absolute;
            width: 45px;
            height: 45px;
            cursor: pointer;
            appearance: none;
            background: rgba(255, 0, 0, 0.35);
            z-index: 10;
        }
        
        .check-box:checked::after {
            content: '✔';
            position: absolute;
            top: -12px;
            left: 4px;
            font-size: 55px;
            color: #000000;
            font-weight: bold;
        }

        #control-panel {
            position: sticky;
            top: 10px;
            z-index: 1000;
        }

        @media print {
            body { background: transparent; padding: 0; margin: 0; }
            .wrapper { transform: none; margin-bottom: 0; box-shadow: none; }
            #control-panel { display: none !important; }
            .input-box, .check-box { background: transparent !important; }
        }
    </style>
</head>
<body>

    <div id="control-panel" class="bg-gray-900 text-white p-4 rounded-xl mb-4 flex justify-between items-center shadow-2xl gap-4">
        <span class="text-[16px]">AIRPLANE NOTAM REQUEST FORM</span>
        <button onclick="generatePDF()" class="bg-blue-600 hover:bg-blue-500 px-6 py-2 rounded-lg font-bold transition text-[18px]">
            📥 SAVE PDF
        </button>
    </div>

    <div id="pdf-content" class="wrapper">
        
        <img src="f1751a44.jpg" alt="Form Background" class="bg-template">
        
        <input type="text" id="topDay" class="input-box" style="left: 1130px; top: 402px; width: 100px;"> 
        <input type="text" id="topMonth" class="input-box" style="left: 1320px; top: 402px; width: 220px;"> 
        <input type="text" id="topYear" class="input-box" style="left: 1645px; top: 402px; width: 150px;"> 
        <input type="text" id="topTime" class="input-box" style="left: 1895px; top: 402px; width: 150px;"> 
        
        <input type="checkbox" class="check-box" style="left: 461px; top: 560px;">
        <input type="checkbox" class="check-box" style="left: 461px; top: 779px;">

        <input type="checkbox" class="check-box" style="left: 1059px; top: 1089px;" checked>
        <input type="text" class="input-box input-left" style="left: 1450px; top: 1080px; width: 650px;" value="กรมแผนที่ทหาร">

        <input type="checkbox" class="check-box" style="left: 1060px; top: 1178px;">
        <input type="checkbox" class="check-box" style="left: 1060px; top: 1243px;">
        <input type="checkbox" class="check-box" style="left: 1060px; top: 1370px;">

        <!-- หัวข้อที่ 4: ประเภทภารกิจ -->
        <input type="text" class="input-box input-left" style="left: 715px; top: 1508px; width: 1350px;" value="บินสำรวจและถ่ายภาพทางอากาศ">

        <!-- หัวข้อที่ 5: สถานที่ (อำเภอและจังหวัด) -->
        <input type="text" id="locationInput1" class="input-box input-left" style="left: 1105px; top: 1720px; width: 1000px;">
        <input type="text" id="locationInput2" class="input-box input-left" style="left: 300px; top: 1787px; width: 1800px;">

        <!-- หัวข้อที่ 6: พิกัดศูนย์กลาง (เว้นว่างไว้) -->
        <input type="text" id="latInput" class="input-box" style="left: 750px; top: 1877px; width: 450px;">
        <input type="text" id="lngInput" class="input-box" style="left: 1595px; top: 1877px; width: 450px;">

        <input type="text" class="input-box" style="left: 535px; top: 2037px; width: 350px;" value="0 - 7000">
        <input type="text" class="input-box" style="left: 1440px; top: 2037px; width: 300px;">

        <input type="text" id="sDay" class="input-box" style="left: 970px; top: 2124px; width: 100px;"> 
        <input type="text" id="sMonth" class="input-box" style="left: 1205px; top: 2124px; width: 250px;"> 
        <input type="text" id="sYear" class="input-box" style="left: 1550px; top: 2124px; width: 180px;"> 
        <input type="text" id="sTime" class="input-box" style="left: 1930px; top: 2124px; width: 150px;"> 
        
        <input type="text" id="eDay" class="input-box" style="left: 970px; top: 2190px; width: 100px;"> 
        <input type="text" id="eMonth" class="input-box" style="left: 1205px; top: 2190px; width: 250px;"> 
        <input type="text" id="eYear" class="input-box" style="left: 1550px; top: 2190px; width: 180px;"> 
        <input type="text" id="eTime" class="input-box" style="left: 1930px; top: 2190px; width: 150px;"> 
        
        <input type="text" class="input-box input-left" style="left: 1250px; top: 2259px; width: 850px;" value="DAILY">

        <input type="text" id="coordName" class="input-box input-left" style="left: 750px; top: 2341px; width: 650px;"> 
        <input type="text" id="num" class="input-box input-left" style="left: 1530px; top: 2341px; width: 450px;"> 
        <input type="text" id="coordPosition" class="input-box input-left" style="left: 750px; top: 2411px; width: 650px;"> 
        <input type="text" class="input-box input-left" style="left: 1615px; top: 2411px; width: 380px;" value="กรมแผนที่ทหาร"> 
        <input type="checkbox" class="check-box" style="left: 300px; top: 2500px;">

        <input type="text" id="emergName" class="input-box input-left" style="left: 750px; top: 2592px; width: 650px;"> 
        <input type="text" id="emergPhone" class="input-box input-left" style="left: 1520px; top: 2592px; width: 450px;"> 

        <!-- Section 12: รายละเอียดเพิ่มเติม -->
        <input type="text" id="detailLine1" class="input-box input-left" style="left: 700px; top: 2684px; width: 1350px;">
        <input type="text" id="detailLine2" class="input-box input-left" style="left: 400px; top: 2750px; width: 1650px;">
        <input type="text" id="detailLine3" class="input-box input-left" style="left: 400px; top: 2815px; width: 1650px;">

        <input type="text" id="signName" class="input-box input-left" style="left: 1572px; top: 2957px; width: 500px;"> 
        <input type="text" id="signFullName" class="input-box" style="left: 1550px; top: 3024px; width: 500px;">         
        <input type="text" id="signPosition" class="input-box input-left" style="left: 1577px; top: 3092px; width: 380px;"> 
        <input type="text" id="signPhone" class="input-box input-left" style="left: 1630px; top: 3158px; width: 380px;"> 
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);

        const sDay = params.get('s_day') || '';
        const sMonth = params.get('s_month') || '';
        const sYear = params.get('s_year') || '';
        const sTime = params.get('s_time') || '08:00';

        const eDay = params.get('e_day') || sDay;
        const eMonth = params.get('e_month') || sMonth;
        const eYear = params.get('e_year') || sYear;
        const eTime = params.get('e_time') || '17:00';

        const locationVal = params.get('location') || '';
        const coordinatorRaw = params.get('coordinator') || '';
        const emergencyRaw = params.get('emergency') || '';

        const det1 = params.get('det1') || '';
        const det2 = params.get('det2') || '';

        if (det1) document.getElementById('detailLine1').value = det1;

        if (det2) {
            const tabSpace = '\u2003\u2003'; 
            const pointsArray = det2.split(tabSpace);
            const pointsPerLine = 2; 
            const line2Points = pointsArray.slice(0, pointsPerLine);
            const line3Points = pointsArray.slice(pointsPerLine);
            
            document.getElementById('detailLine2').value = line2Points.join(tabSpace);
            document.getElementById('detailLine3').value = line3Points.join(tabSpace);
        }

        // หัวข้อที่ 5: สถานที่ (อำเภอ / จังหวัด)
        if (locationVal && locationVal !== '-') {
            document.getElementById('locationInput1').value = locationVal;
        }

        if(sDay) document.getElementById('sDay').value = sDay;
        if(sMonth) document.getElementById('sMonth').value = sMonth;
        if(sYear) document.getElementById('sYear').value = sYear;
        if(sTime) document.getElementById('sTime').value = sTime;

        if(eDay) document.getElementById('eDay').value = eDay;
        if(eMonth) document.getElementById('eMonth').value = eMonth;
        if(eYear) document.getElementById('eYear').value = eYear;
        if(eTime) document.getElementById('eTime').value = eTime;

        const today = new Date();
        document.getElementById('topDay').value = today.getDate();
        const thaiMonths = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
        document.getElementById('topMonth').value = thaiMonths[today.getMonth()];
        document.getElementById('topYear').value = today.getFullYear() + 543;
        document.getElementById('topTime').value = String(today.getHours()).padStart(2, '0') + ':' + String(today.getMinutes()).padStart(2, '0');

        async function loadPersonnelDetails() {
            try {
                const res = await fetch('personnel.json');
                if (!res.ok) throw new Error("ไม่สามารถโหลดไฟล์ personnel.json ได้");
                const personnelList = await res.json();

                const coordinatorPerson = personnelList.find(p => {
                    const displayName = p.name || `${p.rank || ''} ${p.first_name || ''} ${p.last_name || ''}`.trim();
                    return displayName === coordinatorRaw || p.name === coordinatorRaw;
                });

                if (coordinatorPerson) {
                    if (coordinatorPerson.name) {
                        document.getElementById('coordName').value = coordinatorPerson.name;
                        document.getElementById('signName').value = coordinatorPerson.name;
                    }
                    if (coordinatorPerson.position) {
                        document.getElementById('coordPosition').value = coordinatorPerson.position;
                        document.getElementById('signPosition').value = coordinatorPerson.position;
                    }
                    if (coordinatorPerson.num) {
                        document.getElementById('num').value = coordinatorPerson.num;
                        document.getElementById('signPhone').value = coordinatorPerson.num;
                    }
                    if (coordinatorPerson.name2) {
                        document.getElementById('signFullName').value = coordinatorPerson.name2;
                    } else if (coordinatorPerson.name) {
                        document.getElementById('signFullName').value = coordinatorPerson.name;
                    }
                } else if (coordinatorRaw) {
                    document.getElementById('coordName').value = coordinatorRaw;
                    document.getElementById('signName').value = coordinatorRaw;
                    document.getElementById('signFullName').value = coordinatorRaw;
                }

                const emergencyPerson = personnelList.find(p => {
                    const displayName = p.name || `${p.rank || ''} ${p.first_name || ''} ${p.last_name || ''}`.trim();
                    return displayName === emergencyRaw || p.name === emergencyRaw;
                });

                if (emergencyPerson) {
                    if (emergencyPerson.name) {
                        document.getElementById('emergName').value = emergencyPerson.name;
                    }
                    if (emergencyPerson.num) {
                        document.getElementById('emergPhone').value = emergencyPerson.num;
                    }
                } else if (emergencyRaw) {
                    const match = emergencyRaw.match(/^(.*?)\s*\((.*?)\)$/);
                    if (match) {
                        document.getElementById('emergName').value = match[1].trim();
                        document.getElementById('emergPhone').value = match[2].trim();
                    } else {
                        document.getElementById('emergName').value = emergencyRaw.trim();
                    }
                }

            } catch (err) {
                console.error(err);
                if (coordinatorRaw) {
                    document.getElementById('coordName').value = coordinatorRaw;
                    document.getElementById('signName').value = coordinatorRaw;
                    document.getElementById('signFullName').value = coordinatorRaw;
                }
                if (emergencyRaw) {
                    document.getElementById('emergName').value = emergencyRaw;
                }
            }
        }

        loadPersonnelDetails();

        function generatePDF() {
            const inputs = document.querySelectorAll('.input-box, .check-box');
            inputs.forEach(el => el.style.background = 'transparent');

            const element = document.getElementById('pdf-content');
            
            const opt = {
                margin:       0,
                filename:     'Airplane_NOTAM_Request_Form.pdf',
                image:        { type: 'jpg', quality: 1 },
                html2canvas:  { scale: 1, useCORS: true, scrollY: 0 },
                jsPDF:        { unit: 'px', format: [2484, 3511], orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save()
            .then(() => {
                inputs.forEach(el => el.style.background = 'rgba(255, 0, 0, 0.25)');
            })
            .catch(err => {
                console.error(err);
                window.print();
                inputs.forEach(el => el.style.background = 'rgba(255, 0, 0, 0.25)');
            });
        }
    </script>
</body>
</html>
