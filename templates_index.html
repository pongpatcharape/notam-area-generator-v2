<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>AeroFocus NOTAM - Mission Control</title>

<!-- Material Symbols & Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700&family=Inter:wght@400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<script id="tailwind-config">
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    "surface": "#10131b",
                    "surface-slate": "#1E222A",
                    "aviation-deep-blue": "#0E1117",
                    "primary": "#adc7ff",
                    "primary-container": "#4a8eff",
                    "on-primary-container": "#00285b",
                    "on-surface": "#e0e2ed",
                    "on-surface-variant": "#c1c6d7",
                    "outline-variant": "#414754",
                    "background": "#10131b"
                }
            }
        }
    }
</script>
<style>
    .glass-panel { background: rgba(30, 34, 42, 0.95); backdrop-filter: blur(8px); border: 1px solid #414754; }
    #map { width: 100%; height: 100%; z-index: 0; }
    .ts-control { background-color: #111827 !important; border: 1px solid #374151 !important; border-radius: 0.5rem !important; padding: 8px 12px !important; color: #ffffff !important; min-height: 42px; }
    .ts-control .item { background-color: #ef4444 !important; color: #ffffff !important; border-radius: 4px !important; padding: 2px 8px !important; font-weight: 500; }
    .ts-control .item .remove { border-left: none !important; color: #ffffff !important; }
    .ts-dropdown { background-color: #1E222A !important; border: 1px solid #414754 !important; color: #e0e2ed !important; border-radius: 0.5rem; z-index: 9999 !important; }
    .ts-dropdown .option:hover, .ts-dropdown .active { background-color: #374151 !important; color: #ffffff !important; }
    .ts-control input { color: #ffffff !important; }
    .grid-label {
        color: #1e3a8a; font-size: 11px; font-weight: 700; font-family: 'JetBrains Mono', monospace; text-align: center;
        text-shadow: 1px 1px 2px #ffffff, -1px -1px 2px #ffffff, 1px -1px 2px #ffffff, -1px 1px 2px #ffffff; pointer-events: none;
    }
</style>

<body class="bg-aviation-deep-blue text-on-surface font-body-sm h-screen overflow-hidden flex flex-col">

<nav class="top-0 bg-aviation-deep-blue border-b border-outline-variant z-50">
    <div class="flex justify-between items-center w-full px-6 py-3 h-16">
        <div class="flex items-center gap-4">
            <span class="text-xl font-bold text-primary">NOTAM AREA GENERATOR</span>
        </div>
        <div class="flex items-center gap-4 text-on-surface-variant">
            <button class="hover:text-primary transition-colors p-2 rounded-full"><span class="material-symbols-outlined">account_circle</span></button>
        </div>
    </div>
</nav>

<div class="flex flex-1 overflow-hidden relative">
    
    <!-- Sidebar -->
    <aside class="fixed left-0 top-16 bottom-0 w-[280px] z-40 flex flex-col p-4 bg-surface-slate border-r border-outline-variant hidden md:flex">
        <div class="mb-6 flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container font-bold">
                <span class="material-symbols-outlined">rocket_launch</span>
            </div>
            <div>
                <h2 class="font-bold text-on-surface">Mission Control</h2>
                <p class="text-xs text-on-surface-variant uppercase">Aerial Photography Ops</p>
            </div>
        </div>
        
        <nav class="flex-1 flex flex-col gap-2">
            <button id="btn-generator" class="flex items-center justify-between bg-primary-container text-on-primary-container rounded-lg px-4 py-3 w-full text-left font-semibold hover:opacity-90 transition-opacity">
                <div class="flex items-center gap-3"><span class="material-symbols-outlined">radar</span><span>Generator</span></div>
                <span id="icon-generator" class="material-symbols-outlined transition-transform">expand_more</span>
            </button>
            <div id="submenu-generator" class="hidden flex-col gap-2 pl-6 pr-2 py-2">
                <button id="btn-airplane" class="flex items-center gap-3 bg-[#111827] text-white hover:bg-blue-600 rounded-lg px-4 py-2.5 w-full text-left font-medium border border-outline-variant transition-colors">
                    <span class="material-symbols-outlined text-[18px]">flight</span><span>Airplane</span>
                </button>
                <button id="btn-uav" class="flex items-center gap-3 bg-[#111827] text-white hover:bg-orange-600 rounded-lg px-4 py-2.5 w-full text-left font-medium border border-outline-variant transition-colors">

            </div>
        </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 relative md:ml-[280px] bg-background flex flex-col h-full overflow-hidden">
        <div id="map"></div>

        <!-- ✈️ PANEL: AIRPLANE -->
        <div id="panel-airplane" class="hidden absolute left-6 top-6 z-10 w-[360px] max-w-[calc(100vw-32px)]">
            <div class="glass-panel rounded-lg p-5 flex flex-col gap-4 shadow-2xl border-t-4 border-t-blue-500">
                <div class="flex justify-between items-center border-b border-outline-variant pb-2">
                    <h3 class="text-xs font-bold text-on-surface-variant uppercase flex items-center gap-2">
                        <span class="material-symbols-outlined text-[18px]">flight</span> AIRPLANE PROJECT
                    </h3>
                    <button class="btn-close-panel text-on-surface-variant hover:text-white transition-colors"><span class="material-symbols-outlined text-[18px]">close</span></button>
                </div>
                <section class="flex flex-col gap-3">
                    <div class="flex flex-col gap-1">
                        <label class="text-xs text-on-surface">Project Name</label>
                        <input id="projectNameAir" class="bg-[#111827] border border-gray-700 rounded-lg px-3 py-2 text-sm text-on-surface focus:border-blue-500 outline-none w-full" type="text" value="NOTAM A_00">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-xs text-on-surface font-medium">L7018 SHEET:</label>
                        <select id="sheetSelect" multiple placeholder="พิมพ์ค้นหา หรือเลือกระวาง..." class="w-full"></select>
                    </div>
                </section>
                <section class="flex flex-col gap-3">
                    <h3 class="text-xs font-bold text-on-surface-variant uppercase border-b border-outline-variant pb-2">AREA PARAMETERS</h3>
                    <div class="grid grid-cols-2 gap-3">
                        <div class="flex flex-col gap-1">
                            <label class="text-xs text-on-surface">N-S (NM)</label>
                            <input id="nsNm" class="bg-[#111827] border border-gray-700 rounded-lg px-3 py-2 text-sm text-on-surface focus:border-blue-500 outline-none w-full" step="0.5" type="number" value="5.0">
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="text-xs text-on-surface">W-E (NM)</label>
                            <input id="weNm" class="bg-[#111827] border border-gray-700 rounded-lg px-3 py-2 text-sm text-on-surface focus:border-blue-500 outline-none w-full" step="0.5" type="number" value="3.0">
                        </div>
                    </div>
                </section>
                <div class="flex flex-col gap-2 mt-2">
                    <button onclick="calculateFlightArea()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 px-4 rounded-xl flex items-center justify-center gap-2 transition-all shadow-md">
                        <span class="material-symbols-outlined text-[18px]">public</span> Generate Flight Area
                    </button>
                    <button id="downloadBtnAir" onclick="downloadZipPackage()" class="hidden w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 px-4 rounded-xl flex items-center justify-center gap-2 transition-all text-sm shadow-md">
                        <span class="material-symbols-outlined text-[18px]">download</span> Download KML / Excel ZIP
                    </button>
                </div>
            </div>
        </div>

        <!-- 🚁 PANEL: UAV -->
        <div id="panel-uav" class="hidden absolute left-6 top-6 z-10 w-[360px] max-w-[calc(100vw-32px)]">
            <div class="glass-panel rounded-lg p-5 flex flex-col gap-4 shadow-2xl border-t-4 border-t-orange-500">
                <div class="flex justify-between items-center border-b border-outline-variant pb-2">
                    <h3 class="text-xs font-bold text-orange-400 uppercase flex items-center gap-2">
                        <span class="material-symbols-outlined text-[18px]">drone</span> UAV PROJECT DETAILS
                    </h3>
                    <button class="btn-close-panel text-on-surface-variant hover:text-white transition-colors"><span class="material-symbols-outlined text-[18px]">close</span></button>
                </div>
                <section class="flex flex-col gap-3">
                    <div class="flex flex-col gap-1">
                        <label class="text-xs text-on-surface">Project Name</label>
                        <input id="projectNameUav" class="bg-[#111827] border border-gray-700 rounded-lg px-3 py-2 text-sm text-on-surface focus:border-orange-500 outline-none w-full" type="text" value="UAV mapping 01">
                    </div>
                    
                    <!-- NEW FIELD: Location -->
                    <div class="flex flex-col gap-1">
                        <label class="text-xs text-on-surface">Location</label>
                        <input id="uavLocation" class="bg-[#111827] border border-gray-700 rounded-lg px-3 py-2 text-sm text-on-surface focus:border-orange-500 outline-none w-full" type="text" placeholder="สถานที่ปฏิบัติงาน">
                    </div>
                    
                    <div class="flex flex-col gap-1 mt-2">
                        <label class="text-xs text-on-surface font-medium uppercase">Upload KML / GeoJSON</label>
                        <input type="file" id="uavFileInput" accept=".kml,.geojson" class="block w-full text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-orange-500/20 file:text-orange-400 hover:file:bg-orange-500/30 bg-[#111827] rounded-lg border border-gray-700 cursor-pointer">
                    </div>
                </section>

                <section class="flex flex-col gap-3">
                    <h3 class="text-xs font-bold text-on-surface-variant uppercase border-b border-outline-variant pb-2">AREA BUFFER</h3>
                    <div class="flex flex-col gap-1">
                        <label class="text-xs text-on-surface">Buffer Distance (Meters)</label>
                        <input id="uavBufferMeters" class="bg-[#111827] border border-gray-700 rounded-lg px-3 py-2 text-sm text-on-surface focus:border-orange-500 outline-none w-full" step="10" type="number" value="50">
                        <span class="text-[10px] text-orange-300 mt-1">🚁 คลิกบนแผนที่เพื่อสร้างมุมพื้นที่ หรืออัปโหลดไฟล์ KML</span>
                    </div>
                </section>
                <div class="flex flex-col gap-2 mt-2">
                    <div class="flex gap-2">
                        <button onclick="clearUAVMap()" class="bg-gray-700 hover:bg-gray-600 text-white font-semibold py-3 px-3 rounded-xl flex items-center justify-center transition-all shadow-md" title="ล้างจุดทั้งหมด">
                            <span class="material-symbols-outlined text-[18px]">delete</span>
                        </button>
                        <button onclick="calculateUAVArea()" class="flex-1 bg-orange-600 hover:bg-orange-500 text-white font-semibold py-3 px-4 rounded-xl flex items-center justify-center gap-2 transition-all shadow-md">
                            <span class="material-symbols-outlined text-[18px]">architecture</span> Generate Flight Area
                        </button>
                    </div>
                    <button id="downloadBtnUav" onclick="downloadUavPackage()" class="hidden w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 px-4 rounded-xl flex items-center justify-center gap-2 transition-all text-sm shadow-md">
                        <span class="material-symbols-outlined text-[18px]">download</span> Download KML / Excel ZIP
                    </button>
                </div>
            </div>

    </main>

<!-- Leaflet JS Script -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Tom Select JS -->
<script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>

<script>
    let currentMode = 'none'; 
    
    let rawGeoJSONData = null;
    let tomSelectControl = null;
    let geojsonIndexLayer = null; 
    let innerLayer = null;        
    let bufferLayer = null;       
    let sheetLayers = {}; 
    let gridLabelsLayer = L.layerGroup(); 
    const ZOOM_THRESHOLD = 9; 

    let uavPoints = [];
    let uavMarkersLayer = L.layerGroup();
    let uavPolygonLayer = L.polygon([], { color: '#f97316', fillColor: '#f97316', fillOpacity: 0.1, weight: 2, dashArray: '5, 5' });
    let uavInnerLayer = null;
    let uavBufferLayer = null;
    let map = null;

    document.addEventListener("DOMContentLoaded", function () {
        const btnGenerator = document.getElementById('btn-generator');
        const submenuGenerator = document.getElementById('submenu-generator');
        const iconGenerator = document.getElementById('icon-generator');
        const btnAirplane = document.getElementById('btn-airplane');
        const btnUav = document.getElementById('btn-uav');
        const panelAirplane = document.getElementById('panel-airplane');
        const panelUav = document.getElementById('panel-uav');
        const closeBtns = document.querySelectorAll('.btn-close-panel');

        btnGenerator.addEventListener('click', function() {
            submenuGenerator.classList.toggle('hidden');
            submenuGenerator.classList.toggle('flex');
            iconGenerator.style.transform = submenuGenerator.classList.contains('hidden') ? 'rotate(0deg)' : 'rotate(180deg)';
        });

        btnAirplane.addEventListener('click', function() {
            currentMode = 'airplane';
            panelUav.classList.add('hidden');
            panelAirplane.classList.remove('hidden');
            clearUAVMap(); 

            if (geojsonIndexLayer && !map.hasLayer(geojsonIndexLayer)) {
                map.addLayer(geojsonIndexLayer);
            }
            if (map.getZoom() >= ZOOM_THRESHOLD && !map.hasLayer(gridLabelsLayer)) {
                map.addLayer(gridLabelsLayer);
            }
        });

        btnUav.addEventListener('click', function() {
            currentMode = 'uav';
            panelAirplane.classList.add('hidden');
            panelUav.classList.remove('hidden');

            if (geojsonIndexLayer && map.hasLayer(geojsonIndexLayer)) {
                map.removeLayer(geojsonIndexLayer);
            }
            if (map.hasLayer(gridLabelsLayer)) {
                map.removeLayer(gridLabelsLayer);
            }

            if(innerLayer) map.removeLayer(innerLayer);
            if(bufferLayer) map.removeLayer(bufferLayer);
            if(tomSelectControl) tomSelectControl.clear();
        });

        closeBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                panelAirplane.classList.add('hidden');
                panelUav.classList.add('hidden');
                currentMode = 'none';

                if (geojsonIndexLayer && !map.hasLayer(geojsonIndexLayer)) {
                    map.addLayer(geojsonIndexLayer);
                }
            });
        });

        map = L.map('map', { renderer: L.canvas() }).setView([13.7563, 100.5018], 6);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap contributors' }).addTo(map);
        
        uavMarkersLayer.addTo(map);
        uavPolygonLayer.addTo(map);

        map.on('click', function(e) {
            if (currentMode === 'uav') {
                addUavPoint(e.latlng);
            }
        });

        map.on('zoomend', function() {
            if (currentMode === 'airplane' && map.getZoom() >= ZOOM_THRESHOLD) {
                if (!map.hasLayer(gridLabelsLayer)) map.addLayer(gridLabelsLayer);
            } else {
                if (map.hasLayer(gridLabelsLayer)) map.removeLayer(gridLabelsLayer);
            }
        });

        const selectEl = document.getElementById('sheetSelect');
        if (selectEl) {
            tomSelectControl = new TomSelect('#sheetSelect', {
                plugins: ['remove_button', 'clear_button'], create: false, maxItems: null, placeholder: 'พิมพ์ค้นหา หรือเลือกระวาง...'
            });
            tomSelectControl.on('item_remove', function(value) {
                if (sheetLayers[value]) sheetLayers[value].setStyle({ color: '#2563eb', weight: 1, fillColor: '#3b82f6', fillOpacity: 0.05 });
            });
            tomSelectControl.on('item_add', function(value) {
                if (sheetLayers[value]) sheetLayers[value].setStyle({ color: '#0ea5e9', weight: 3, fillColor: '#0ea5e9', fillOpacity: 0.4 });
            });
        }

        fetch('/index_l7018.json')
            .then(res => res.json())
            .then(data => {
                rawGeoJSONData = data;
                if (data && data.features) {
                    geojsonIndexLayer = L.geoJSON(data, {
                        style: { color: '#2563eb', weight: 1, fillColor: '#3b82f6', fillOpacity: 0.05 },
                        onEachFeature: function(feature, layer) {
                            const sheetNo = feature.properties.Sheet_dash || feature.properties.sheet_dash || feature.properties.SHEET_DASH;
                            if (sheetNo) {
                                sheetLayers[sheetNo] = layer;
                                const center = layer.getBounds().getCenter();
                                gridLabelsLayer.addLayer(L.marker(center, { icon: L.divIcon({ className: 'grid-label', html: `${sheetNo}`, iconSize: [60, 20], iconAnchor: [30, 10] }), interactive: false }));
                                layer.bindPopup(`<b>ระวาง L7018:</b> ${sheetNo}`);

                                layer.on('click', function(e) {
                                    if (currentMode !== 'airplane') return; 
                                    if (tomSelectControl) {
                                        const vals = tomSelectControl.getValue();
                                        const vArr = Array.isArray(vals) ? vals : (vals ? [vals] : []);
                                        if (!vArr.includes(sheetNo)) tomSelectControl.addItem(sheetNo);
                                    }
                                });

                                layer.on('mouseover', function() {
                                    if (currentMode !== 'airplane') return;
                                    const vals = tomSelectControl ? tomSelectControl.getValue() : [];
                                    if (Array.isArray(vals) ? vals.includes(sheetNo) : vals === sheetNo) {
                                        layer.setStyle({ fillOpacity: 0.6 });
                                    } else {
                                        layer.setStyle({ fillOpacity: 0.3, weight: 2 });
                                    }
                                });

                                layer.on('mouseout', function() {
                                    if (currentMode !== 'airplane') return;
                                    const vals = tomSelectControl ? tomSelectControl.getValue() : [];
                                    if (Array.isArray(vals) ? vals.includes(sheetNo) : vals === sheetNo) {
                                        layer.setStyle({ color: '#0ea5e9', weight: 3, fillColor: '#0ea5e9', fillOpacity: 0.4 });
                                    } else {
                                        layer.setStyle({ color: '#2563eb', weight: 1, fillColor: '#3b82f6', fillOpacity: 0.05 });
                                    }
                                });
                            }
                        }
                    }).addTo(map);

                    const sheetOptions = [];
                    data.features.forEach(f => {
                        const s = f.properties.Sheet_dash || f.properties.sheet_dash || f.properties.SHEET_DASH;
                        if (s && !sheetOptions.includes(s)) sheetOptions.push(s);
                    });
                    sheetOptions.sort();
                    if (tomSelectControl) sheetOptions.forEach(s => tomSelectControl.addOption({ value: s, text: s }));
                }
            }).catch(e => console.error(e));
    });

    // ==========================================
    // 🚁 UAV LOGIC
    // ==========================================
    function addUavPoint(latlng) {
        uavPoints.push(latlng);
        redrawUavShape();
    }

    function redrawUavShape() {
        uavMarkersLayer.clearLayers();
        uavPoints.forEach((latlng, index) => {
            let marker = L.circleMarker(latlng, { color: '#fff', weight: 1, radius: 6, fillColor: '#ef4444', fillOpacity: 1 });
            marker.on('click', function(e) {
                L.DomEvent.stopPropagation(e); 
                uavPoints.splice(index, 1);
                redrawUavShape();
            });
            uavMarkersLayer.addLayer(marker);
        });
        uavPolygonLayer.setLatLngs(uavPoints);
    }

    function clearUAVMap() {
        uavPoints = [];
        uavMarkersLayer.clearLayers();
        uavPolygonLayer.setLatLngs([]);
        if(uavInnerLayer) map.removeLayer(uavInnerLayer);
        if(uavBufferLayer) map.removeLayer(uavBufferLayer);
        document.getElementById('downloadBtnUav').classList.add('hidden');
    }

    document.getElementById('uavFileInput').addEventListener('change', async function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const formData = new FormData();
        formData.append('file', file);

        try {
            const res = await fetch('/api/upload_kml', {
                method: 'POST',
                body: formData
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || "Upload failed");

            uavPoints = data.coordinates.map(c => L.latLng(c[1], c[0]));
            
            if (uavPoints.length > 1 && 
                uavPoints[0].lat === uavPoints[uavPoints.length-1].lat && 
                uavPoints[0].lng === uavPoints[uavPoints.length-1].lng) {
                uavPoints.pop();
            }
            
            if (data.location_name && data.location_name !== "") {
               document.getElementById('uavLocation').value = data.location_name;
            }

            redrawUavShape();
            if (uavPoints.length > 0) {
                map.fitBounds(uavPolygonLayer.getBounds(), { padding: [30, 30] });
            }
            alert("นำเข้าพิกัด KML สำเร็จ พร้อมคำนวณ Buffer ได้เลยครับ!");
        } catch (err) {
            alert("เกิดข้อผิดพลาดในการอัปโหลด: " + err.message);
        }
    });

async function calculateUAVArea() {
    if (uavPoints.length < 3) {
        alert("กรุณาจิ้มจุดบนแผนที่อย่างน้อย 3 จุด หรืออัปโหลดไฟล์ KML เพื่อสร้างพื้นที่ทำงานครับสุดหล่อ!");
        return;
    }

    const bufferMeters = parseFloat(document.getElementById('uavBufferMeters').value || 50);
    const projectName = document.getElementById('projectNameUav').value.trim().replace(/\s+/g, '_') || 'UAV_PROJECT';
    const locationName = document.getElementById('uavLocation').value.trim() || '-';
    
    const polygonCoords = uavPoints.map(p => [p.lng, p.lat]);
    
    const payloadCoords = [...polygonCoords];
    if (payloadCoords.length > 0) {
        payloadCoords.push([payloadCoords[0][0], payloadCoords[0][1]]);
    }

    const payload = {
        project_name: projectName,
        location_name: locationName,
        coordinates: payloadCoords,
        buffer_meters: bufferMeters
    };

    try {
        const res = await fetch('/api/calculate_uav', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (!res.ok) throw new Error("คำนวณพื้นที่ UAV ไม่สำเร็จ");

        const data = await res.json();

        // 📌 เพิ่มตรงนี้ครับ เพื่อดึงชื่อ ตำบล อำเภอ จังหวัด มาแสดงที่หน้าเว็บ
        if (data.location_name) {
            document.getElementById('uavLocation').value = data.location_name;
        }

        if(uavInnerLayer) map.removeLayer(uavInnerLayer);
        if(uavBufferLayer) map.removeLayer(uavBufferLayer);

        uavBufferLayer = L.polygon(data.buffer_coords.map(c => [c[1], c[0]]), {
            color: '#ef4444', fillColor: '#ef4444', fillOpacity: 0.15, weight: 2
        }).addTo(map);

        uavInnerLayer = L.polygon(data.inner_coords.map(c => [c[1], c[0]]), {
            color: '#f97316', fillColor: '#f97316', fillOpacity: 0.2, weight: 3
        }).addTo(map);

        map.fitBounds(uavBufferLayer.getBounds(), { padding: [30, 30] });

        document.getElementById('downloadBtnUav').classList.remove('hidden');
        window.lastUavPayload = payload;

    } catch (err) {
        alert("เกิดข้อผิดพลาด: " + err.message);
    }
}

    async function downloadUavPackage() {
        if (!window.lastUavPayload) {
            alert("กรุณากดคำนวณพื้นที่ UAV ก่อนดาวน์โหลดครับ!");
            return;
        }

        window.lastUavPayload.project_name = document.getElementById('projectNameUav').value.trim().replace(/\s+/g, '_') || 'UAV_PROJECT';
        window.lastUavPayload.location_name = document.getElementById('uavLocation').value.trim() || '-';

        try {
            const res = await fetch('/api/download_uav', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(window.lastUavPayload)
            });

            if (!res.ok) throw new Error("ดาวน์โหลดแพ็กเกจ UAV ไม่สำเร็จ");

            const blob = await res.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${window.lastUavPayload.project_name}_UAV_Package.zip`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            window.URL.revokeObjectURL(url);
        } catch (err) {
            alert("ดาวน์โหลดไม่สำเร็จ: " + err.message);
        }
    }

    // ==========================================
    // ✈️ AIRPLANE LOGIC
    // ==========================================
    function getSelectedSheets() {
        if (!tomSelectControl) return [];
        const val = tomSelectControl.getValue();
        return Array.isArray(val) ? val : (val ? [val] : []);
    }

    function getProjectName() {
        const inputEl = document.getElementById('projectNameAir');
        if (inputEl && inputEl.value.trim() !== "") {
            return inputEl.value.trim().replace(/\s+/g, '_');
        }
        return 'NOTAM_PROJECT';
    }

    function getMergedBoundsOfSelectedSheets(selectedSheets) {
        if (!rawGeoJSONData || !rawGeoJSONData.features) return null;
        let minLat = 90, maxLat = -90, minLng = 180, maxLng = -180;
        let found = false;

        rawGeoJSONData.features.forEach(f => {
            const props = f.properties || {};
            const sheetNo = props.Sheet_dash || props.sheet_dash || props.SHEET_DASH;
            if (selectedSheets.includes(sheetNo)) {
                found = true;
                const geom = f.geometry;
                const coords = geom.type === 'Polygon' ? geom.coordinates[0] : geom.coordinates.flat(1);
                coords.forEach(pt => {
                    const lng = pt[0], lat = pt[1];
                    if (lat < minLat) minLat = lat;
                    if (lat > maxLat) maxLat = lat;
                    if (lng < minLng) minLng = lng;
                    if (lng > maxLng) maxLng = lng;
                });
            }
        });

        if (!found) return null;
        return { minLat, maxLat, minLng, maxLng };
    }

    async function calculateFlightArea() {
        const selectedSheets = getSelectedSheets();
        if (!selectedSheets || selectedSheets.length === 0) {
            alert("กรุณาเลือกระวาง L7018 อย่างน้อย 1 ระวางครับสุดหล่อ!");
            return;
        }

        const bbox = getMergedBoundsOfSelectedSheets(selectedSheets);
        if (!bbox) {
            alert("ไม่พบข้อมูลพิกัดของระวางที่เลือกในไฟล์ GeoJSON ครับ");
            return;
        }

        const ns_nm = parseFloat(document.getElementById('nsNm').value || 5.0);
        const we_nm = parseFloat(document.getElementById('weNm').value || 3.0);
        const ns_deg = ns_nm / 60.0;
        const we_deg = we_nm / 60.0;

        const inner_nw = [bbox.maxLat, bbox.minLng];
        const inner_ne = [bbox.maxLat, bbox.maxLng];
        const inner_se = [bbox.minLat, bbox.maxLng];
        const inner_sw = [bbox.minLat, bbox.minLng];

        const buffer_nw = [bbox.maxLat + ns_deg, bbox.minLng - we_deg];
        const buffer_ne = [bbox.maxLat + ns_deg, bbox.maxLng + we_deg];
        const buffer_se = [bbox.minLat - ns_deg, bbox.maxLng + we_deg];
        const buffer_sw = [bbox.minLat - ns_deg, bbox.minLng - we_deg];

        const payload = {
            project_name: getProjectName(),
            sheets: selectedSheets,
            inner_nw, inner_ne, inner_se, inner_sw,
            buffer_nw, buffer_ne, buffer_se, buffer_sw
        };

        try {
            const res = await fetch('/api/calculate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!res.ok) throw new Error("ส่งข้อมูลคำนวณไม่สำเร็จ");

            if (innerLayer) map.removeLayer(innerLayer);
            if (bufferLayer) map.removeLayer(bufferLayer);

            bufferLayer = L.polygon([buffer_nw, buffer_ne, buffer_se, buffer_sw], {
                color: '#ef4444', fillColor: '#ef4444', fillOpacity: 0.15, weight: 2
            }).addTo(map);

            innerLayer = L.polygon([inner_nw, inner_ne, inner_se, inner_sw], {
                color: '#eab308', fillColor: '#eab308', fillOpacity: 0.2, weight: 3
            }).addTo(map);

            map.fitBounds(bufferLayer.getBounds(), { padding: [30, 30] });

            const downloadBtn = document.getElementById('downloadBtnAir');
            if (downloadBtn) downloadBtn.classList.remove('hidden');

            window.lastPayload = payload;

        } catch (err) {
            alert("เกิดข้อผิดพลาด: " + err.message);
        }
    }

    async function downloadZipPackage() {
        if (!window.lastPayload) {
            alert("กรุณากดคำนวณก่อนดาวน์โหลดครับสุดหล่อ!");
            return;
        }

        window.lastPayload.project_name = getProjectName();

        try {
            const res = await fetch('/api/download', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(window.lastPayload)
            });

            if (!res.ok) throw new Error("เกิดข้อผิดพลาดในการดาวน์โหลด");

            const blob = await res.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${window.lastPayload.project_name}_Package.zip`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            window.URL.revokeObjectURL(url);
        } catch (err) {
            alert("ดาวน์โหลดไม่สำเร็จ: " + err.message);
        }
    }
